name: Bug Report
description: Something is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Describe the actual behavior you saw
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so future-you can reliably reproduce it
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / context
      description: Browser, screen size, related issues, anything else useful
    validations:
      required: false